<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor Alberdi - Sistema de Combustibles</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; max-width: 1600px; margin: 0 auto; }
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* Cabecera del Tanque */
        .card-header { border-bottom: 1px solid #222; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
        .tag-prod { padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .n93 { background: #ffd600; color: #000; } .n97 { background: #0052d4; color: #fff; } 
        .gco { background: #444; color: #fff; } .gsm { background: #999; color: #000; } .glp { background: #f83600; color: #fff; }

        /* Valores de Litros */
        .main-val { font-size: 38px; font-weight: bold; color: #00ff00; line-height: 1; }
        .original-val { font-size: 14px; color: #888; margin-top: 5px; }

        /* Sección de Totalizadores */
        .picos-box { background: #1a1a1a; border-radius: 8px; padding: 12px; border-left: 3px solid #00d4ff; }
        .pico-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 13px; margin-bottom: 5px; border-bottom: 1px solid #282828; padding-bottom: 3px; }
        .pico-name { color: #ffeb3b; font-weight: bold; }
        
        #reloj { text-align: center; color: #555; margin-bottom: 20px; font-family: monospace; }
        .badge-venta { background: #3d0000; color: #ff4444; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>

    <div style="text-align:center; margin-bottom:25px;">
        <h1 style="margin:0; letter-spacing: 2px;">ESTADO DE TANQUES Y PICOS</h1>
        <div id="reloj">Sincronizando datos del servidor...</div>
    </div>

    <div class="grid" id="panel"></div>

<script>
    // URL de tu script de Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxgDwm_R3oE9F9XTVcFl-vzAw5k4KHXg4s8CqS3MUgruoVMmOwVJ-YkcpQmvYIpKIjaKQ/exec";

    function refresh() {
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?action=leerMonitoreo&callback=render`;
        document.body.appendChild(script);
        document.body.removeChild(script);
    }

    function render(res) {
        document.getElementById('reloj').innerText = "ÚLTIMA ACTUALIZACIÓN: " + new Date().toLocaleTimeString();
        const panel = document.getElementById('panel');
        panel.innerHTML = '';

        // Se recorren los 8 tanques configurados en el backend
        for (let i = 1; i <= 8; i++) {
            const conf = res.config.tanques[i];
            const actual = res.actual[i];
            const inicial = res.inicial[i];
            const venta = inicial - actual;
            const claseProd = conf.prod.toLowerCase();

            panel.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <div>
                            <div style="font-size:12px; color:#666">TANQUE ${i}</div>
                            <div style="font-size:18px; font-weight:bold">${conf.nombre}</div>
                        </div>
                        <span class="tag-prod ${claseProd}">${conf.prod}</span>
                    </div>

                    <div>
                        <div class="main-val">${Math.round(actual).toLocaleString()} <small style="font-size:16px">L</small></div>
                        <div class="original-val">
                            Inició con: <b>${Math.round(inicial).toLocaleString()} L</b> 
                            <span class="badge-venta">-${Math.round(venta).toLocaleString()} L</span>
                        </div>
                    </div>

                    <div class="picos-box">
                        <div style="font-size:11px; color:#666; margin-bottom:8px; font-weight:bold">TOTALIZADORES ORIGINALES (Punto Cero)</div>
                        ${renderPicosPorTanque(i)}
                    </div>
                </div>
            `;
        }
    }

    function renderPicosPorTanque(tId) {
        /**
         * RELACIÓN FÍSICA ACTUALIZADA:
         * T5: s2b, s2e (N93)
         * T7: s2d, s2g (Gco)
         *[cite: 7, 8]
         */
        const relacion = {
            1: [],
            2: ["s1d", "s1g"], // Gsm
            3: ["s1b", "s1e"], // N93
            4: ["s1c", "s1f"], // N97
            5: ["s2b", "s2e"], // N93 (Actualizado)
            6: ["s2c", "s2f"], // N97
            7: ["s2d", "s2g"], // Gco (Actualizado)
            8: ["gas"]         // GLP
        };

        const listaPicos = relacion[tId];
        if (!listaPicos || listaPicos.length === 0) return `<div style="color:#444; font-size:12px">Sin picos asociados.</div>`;

        let html = "";
        listaPicos.forEach(nombrePico => {
            html += `
                <div class="pico-row">
                    <span class="pico-name">${nombrePico.toUpperCase()}</span>
                    <span>Registrado en Control Inicial</span>
                </div>
            `;
        });
        return html;
    }

    refresh();
    setInterval(refresh, 30000); // Actualización automática cada 30 segundos
</script>
</body>
</html>

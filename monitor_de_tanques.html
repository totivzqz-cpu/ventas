<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Monitor Alberdi - Sistema de Combustibles</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #080808; color: #eee; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; max-width: 1600px; margin: 0 auto; }
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .card-header { border-bottom: 1px solid #222; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; }
        .tag-prod { padding: 4px 12px; border-radius: 4px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
        .n93 { background: #ffd600; color: #000; } .n97 { background: #0052d4; color: #fff; } 
        .gco { background: #444; color: #fff; } .gsm { background: #e040fb; color: #fff; } .glp { background: #00e676; color: #000; }
        .tank-title { font-size: 16px; font-weight: bold; margin: 0; color: #fff; }
        .tank-visual { height: 160px; background: #222; border: 2px solid #444; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: flex-end; }
        .tank-fill { width: 100%; transition: height 0.5s ease; position: relative; }
        .f-n93 { background: linear-gradient(to top, #e5c100, #ffd600); } .f-n97 { background: linear-gradient(to top, #003fa3, #0052d4); }
        .f-gco { background: linear-gradient(to top, #222, #555); } .f-gsm { background: linear-gradient(to top, #b500c9, #e040fb); }
        .f-glp { background: linear-gradient(to top, #00b34a, #00e676); }
        .tank-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-shadow: 0 2px 4px rgba(0,0,0,0.9); font-weight: bold; }
        .tank-liters { font-size: 24px; color: #fff; } .tank-pct { font-size: 14px; color: #ccc; margin-top: 2px; }
        .picos-box { background: #111; border-radius: 6px; padding: 10px; font-size: 12px; border: 1px solid #222; }
        .loading { text-align: center; font-size: 20px; color: #888; margin-top: 40px; }
        .error-msg { background: #7f1d1d; border: 1px solid #f87171; padding: 15px; border-radius: 8px; max-width: 500px; margin: 20px auto; text-align: center; color: #fca5a5; }
    </style>
</head>
<body>

    <h1 style="text-align:center; margin-bottom:30px; font-weight:300; letter-spacing:1px;">📊 MONITOREO DE STOCK EN TIEMPO REAL</h1>
    <div id="loading" class="loading">Conectando con la central de tanques...</div>
    <div id="contenedor" class="grid"></div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxgDwm_R3oE9F9XTVcFl-vzAw5k4KHXg4s8CqS3MUgruoVMmOwVJ-YkcpQmvYIpKIjaKQ/exec";

    function cargarMonitor() {
        const script = document.createElement('script');
        script.src = `${URL_SCRIPT}?action=leerMonitoreo&callback=renderizar`;
        script.onerror = function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('contenedor').innerHTML = `<div class="error-msg"><strong>Error de Red:</strong><br>No se pudo conectar con el servidor de Google Apps Script.</div>`;
        };
        document.body.appendChild(script);
    }

    function renderizar(res) {
        document.getElementById('loading').style.display = 'none';
        const contenedor = document.getElementById('contenedor');
        contenedor.innerHTML = "";

        if (!res || res.error) {
            contenedor.innerHTML = `<div class="error-msg"><strong>Error del Servidor:</strong><br>${res ? res.error : 'No se recibieron datos de la planilla.'}</div>`;
            return;
        }

        const clasesProd = { "Gco": "gco", "Gsm": "gsm", "N93": "n93", "N97": "n97", "GLP": "glp" };

        for (let i = 1; i <= 8; i++) {
            const nombre = res.config.nombres[i];
            const cap = res.config.capacidades[i];
            const actual = Math.max(0, Math.round(res.actual[i] || 0));
            let pct = cap > 0 ? ((actual / cap) * 100).toFixed(1) : 0;
            pct = Math.min(100, Math.max(0, pct));

            let prodKey = "Gco";
            if (i === 2) prodKey = "Gsm";
            if (i === 3 || i === 5) prodKey = "N93";
            if (i === 4 || i === 6) prodKey = "N97";
            if (i === 8) prodKey = "GLP";

            const LabProd = clasesProd[prodKey] || "gco";

            contenedor.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <div class="tank-title">${nombre}</div>
                        <span class="tag-prod ${LabProd}">${prodKey}</span>
                    </div>
                    <div class="tank-visual">
                        <div class="tank-fill f-${LabProd}" style="height: ${pct}%"></div>
                        <div class="tank-overlay">
                            <div class="tank-liters">${actual.toLocaleString('es-PY')} L</div>
                            <div class="tank-pct">${pct}% de ${cap.toLocaleString('es-PY')} L</div>
                        </div>
                    </div>
                    <div class="picos-box">
                        <div style="font-size:11px; color:#666; margin-bottom:8px; font-weight:bold">TOTALIZADORES ORIGINALES (Punto Cero)</div>
                        ${renderPicosPorTanque(i, res.totalizadores_ini, res.config.mapeoPicos)}
                    </div>
                </div>
            `;
        }
    }

    function renderPicosPorTanque(tId, picosIni, mapeo) {
        const relacion = {
            1: [],
            2: ["s1d", "s1g"], 
            3: ["s1b", "s1e"], 
            4: ["s1c", "s1f"], 
            5: ["s2b", "s2e"], 
            6: ["s2c", "s2f"], 
            7: ["s2d", "s2g"], 
            8: ["gas"]         
        };

        const listaPicos = relacion[tId];
        if (!listaPicos || listaPicos.length === 0) return `<div style="color:#444; font-size:11px">Sin picos mecánicos asociados.</div>`;

        let html = "";
        listaPicos.forEach(nombrePico => {
            const valorIni = picosIni[nombrePico] !== undefined ? picosIni[nombrePico] : 0;
            const infoPico = mapeo[nombrePico] ? mapeo[nombrePico].p : "Litros";
            html += `<div style="display:flex; justify-content:space-between; margin-bottom:3px; color:#ccc;">
                        <span>Pico <strong>${nombrePico.toUpperCase()}</strong> (${infoPico}):</span>
                        <span style="font-family:monospace; color:#00e676;">${Number(valorIni).toLocaleString('es-PY')} L</span>
                     </div>`;
        });
        return html;
    }

    window.onload = cargarMonitor;
</script>
</body>
</html>

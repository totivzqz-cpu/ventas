<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Registros - Ñe'embucu Norte</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #f1f5f9; 
            padding: 15px; 
            margin: 0; 
            padding-bottom: 60px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; font-weight: 300; font-size: 24px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        h1 a { color: #38bdf8; text-decoration: none; }
        
        .card { 
            background: #1e293b; 
            border-radius: 8px; 
            padding: 20px; 
            border: 1px solid #334155; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
            margin-bottom: 20px;
        }
        .card-title { font-size: 18px; color: #38bdf8; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        /* Buscador e Historial */
        .search-box {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .table-responsive {
            overflow-x: auto;
            max-height: 400px;
            border: 1px solid #334155;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        th {
            background: #1e2942;
            color: #38bdf8;
            padding: 12px 10px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            position: sticky;
            top: 0;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            color: #cbd5e1;
        }
        tr:hover {
            background: #1e293b;
        }

        /* Formulario de Edición (Oculto al inicio) */
        #formulario_edicion {
            display: none;
        }

        .grid-formulario {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media(max-width: 600px) {
            .grid-formulario { grid-template-columns: 1fr; }
        }

        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .input-group label { font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        input[type="text"], input[type="number"], select { 
            width: 100%; 
            box-sizing: border-box;
            border: 1px solid #334155; 
            border-radius: 6px;
            background: #0f172a; 
            color: #ffffff;
            padding: 12px;
            font-size: 14px; 
            font-weight: bold;
        }
        input:focus { outline: none; border-color: #38bdf8; background: #131e31; }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .btn-edit { background: #38bdf8; color: #0f172a; padding: 6px 12px; font-size: 11px; }
        .btn-save { background: #10b981; color: white; width: 100%; margin-top: 15px; }
        .btn-cancel { background: #64748b; color: white; width: 100%; margin-top: 5px; }

        #loader { color: #38bdf8; font-weight: bold; text-align: center; margin-bottom: 15px; }
        .badge {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .bg-ok { background: #10b981; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1><a href="menu.html">Ñe'embucu Norte</a></h1>
        <div id="loader">Cargando registros históricos de la base de datos...</div>

        <div class="card" id="seccion_listado">
            <div class="card-title">Historial de Ventas Guardadas</div>
            <input type="text" id="buscador" class="search-box" placeholder="🔍 Buscar por Operador, Fecha o Saldo..." oninput="filtrarTabla()">
            
            <div class="table-responsive">
                <table id="tabla_registros">
                    <thead>
                        <tr id="headers_fila"></tr>
                    </thead>
                    <tbody id="cuerpo_tabla"></tbody>
                </table>
            </div>
        </div>

        <div class="card" id="formulario_edicion">
            <div class="card-title" id="titulo_formulario">Editar Registro</div>
            <form id="formRegistro" onsubmit="event.preventDefault(); guardarCambios();">
                <input type="hidden" id="num_fila_editar">
                
                <div class="grid-formulario" id="campos_formulario">
                    </div>

                <button type="submit" class="btn btn-save">💾 Guardar Cambios en Base de Datos</button>
                <button type="button" class="btn btn-cancel" onclick="cancelarEdicion()">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        // URL DE TU SCRIPT DE GOOGLE (Reemplaza con la URL actual de tu WebApp en producción)
        const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxgDwm_R3oE9F9XTVcFl-vzAw5k4KHXg4s8CqS3MUgruoVMmOwVJ-YkcpQmvYIpKIjaKQ/exec"; 

        let baseDatos = [];
        let headers = [];

        async function cargarHistorico() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader').innerText = "Solicitando datos al servidor...";
            
            try {
                // Reutilizamos de forma transparente 'getHistoricoVentas'
                const response = await fetch(`${URL_SCRIPT}?action=getHistoricoVentas`);
                const data = await response.json();
                
                if (data && data.length > 0) {
                    headers = data[0]; // Encabezados de la Sheet
                    baseDatos = data;  // Filas completas (Fila 0 es header)
                    renderizarTabla();
                } else {
                    document.getElementById('loader').innerText = "No se encontraron registros en la pestaña.";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loader').innerText = "Error al conectar: " + err.message;
            }
        }

        function renderizarTabla() {
            document.getElementById('loader').style.display = 'none';
            const trHeaders = document.getElementById('headers_fila');
            const tbody = document.getElementById('cuerpo_tabla');
            
            trHeaders.innerHTML = "<th>Acción</th>";
            // Mostramos los primeros encabezados críticos para que sea legible en móviles/PC
            const indicesVisibles = [0, 1, 2, 33, 34, 35]; // Fecha, Operador, Ruta, Totales, Saldo, etc.
            
            headers.forEach((h, index) => {
                if (indicesVisibles.includes(index)) {
                    trHeaders.innerHTML += `<th>${h}</th>`;
                }
            });

            tbody.innerHTML = "";
            // Recorrer filas en orden descendente para ver las últimas primero
            for (let i = baseDatos.length - 1; i >= 1; i--) {
                const fila = baseDatos[i];
                if (!fila[0]) continue; // Omitir vacíos

                let htmlFila = `<tr>`;
                htmlFila += `<td><button type="button" class="btn btn-edit" onclick="prepararEdicion(${i})">✏️ Editar</button></td>`;
                
                headers.forEach((h, index) => {
                    if (indicesVisibles.includes(index)) {
                        let valor = fila[index] || "";
                        if (valor instanceof Date || (typeof valor === "string" && valor.includes("T"))) {
                            valor = new Date(valor).toLocaleDateString('es-PY') + " " + new Date(valor).toLocaleTimeString('es-PY', {hour: '2-digit', minute:'2-digit'});
                        }
                        htmlFila += `<td>${valor}</td>`;
                    }
                });
                
                htmlFila += `</tr>`;
                tbody.innerHTML += htmlFila;
            }
        }

        function prepararEdicion(numFila) {
            const registro = baseDatos[numFila];
            document.getElementById('num_fila_editar').value = numFila;
            document.getElementById('titulo_formulario').innerText = `Editando Registro - Fila ${numFila + 1}`;
            
            const contenedorCampos = document.getElementById('campos_formulario');
            contenedorCampos.innerHTML = "";

            // Generar dinámicamente los campos con los nombres de variables coherentes de la hoja
            headers.forEach((h, index) => {
                if (!h) return;
                
                const valor = registro[index] !== undefined ? registro[index] : "";
                const esSoloLectura = (index === 0) ? "readonly style='background:#0f172a; opacity: 0.6;'" : ""; // Bloquear fecha inicial

                contenedorCampos.innerHTML += `
                    <div class="input-group">
                        <label>${h}</label>
                        <input type="text" id="campo_${index}" name="${h}" value="${valor}" ${esSoloLectura}>
                    </div>
                `;
            });

            document.getElementById('seccion_listado').style.display = 'none';
            document.getElementById('formulario_edicion').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelarEdicion() {
            document.getElementById('seccion_listado').style.display = 'block';
            document.getElementById('formulario_edicion').style.display = 'none';
        }

        function filtrarTabla() {
            const query = document.getElementById('buscador').value.toLowerCase();
            const filas = document.querySelectorAll('#cuerpo_tabla tr');
            filas.forEach(f => {
                f.style.display = f.innerText.toLowerCase().includes(query) ? '' : 'none';
            });
        }

        async function guardarCambios() {
            const numFila = document.getElementById('num_fila_editar').value;
            const payload = {
                action: "editarRegistroExistente",
                numFila: parseInt(numFila) + 1, // Convertir de índice 0 a fila real de Sheets
                datos: {}
            };

            headers.forEach((h, index) => {
                if (!h) return;
                payload.datos[h] = document.getElementById(`campo_${index}`).value;
            });

            document.getElementById('loader').style.display = 'block';
            document.getElementById('loader').innerText = "Guardando cambios en la base de datos...";

            try {
                const res = await fetch(URL_SCRIPT, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    alert("¡Registro modificado con éxito!");
                    cancelarEdicion();
                    cargarHistorico();
                } else {
                    alert("Error al editar: " + result.message);
                    document.getElementById('loader').style.display = 'none';
                }
            } catch (err) {
                alert("Error de red o permisos.");
                console.error(err);
                document.getElementById('loader').style.display = 'none';
            }
        }

        // Ejecutar carga al abrir la app
        window.onload = cargarHistorico;
    </script>
</body>
</html>

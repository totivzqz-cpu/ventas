<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto Inicial - Sistema Alberdi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; font-size: 12px; margin: 0; background-color: #eceff1; color: #37474f; padding: 20px; }
        .contenedor { max-width: 900px; margin: auto; background: #cfd8dc; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background: #263238; color: #ffeb3b; padding: 15px; text-align: center; border-radius: 6px; margin-bottom: 20px; }
        .seccion { background: white; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #b0bec5; }
        h3 { margin-top: 0; color: #263238; border-bottom: 2px solid #546e7a; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .campo { display: flex; flex-direction: column; margin-bottom: 8px; }
        label { font-weight: bold; margin-bottom: 2px; color: #455a64; }
        input { padding: 6px; border: 1px solid #cfd8dc; border-radius: 4px; }
        .btn { width: 100%; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        .btn:disabled { background: #9e9e9e; }
    </style>
</head>
<body>

<div class="contenedor">
    <div class="header">
        <h1>CONFIGURACIÓN DE PUNTO CERO</h1>
    </div>

    <form id="formInit">
        <div class="seccion">
            <h3>Datos Generales</h3>
            <div class="grid">
                <div class="campo"><label>Fecha:</label><input type="date" id="fecha" required></div>
                <div class="campo"><label>Responsable:</label><input type="text" id="resp" required></div>
            </div>
        </div>

        <div class="seccion">
            <h3>Inventario Inicial (Tanques 1-8)</h3>
            <div class="grid">
                <div class="campo"><label>T1 (GCO-Res):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T2 (GSM):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T3 (N93):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T4 (N97):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T5 (N93):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T6 (N97):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T7 (GCO):</label><input type="number" step="0.01" class="t-in"></div>
                <div class="campo"><label>T8 (GLP):</label><input type="number" step="0.01" class="t-in"></div>
            </div>
        </div>

        <div class="seccion">
            <h3>Totalizadores Iniciales (Picos 1-13)</h3>
            <div class="grid">
                <div class="campo"><label>P1 (N93):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P2 (N97):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P3 (GSM):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P4 (N93):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P5 (N97):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P6 (GSM):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P7 (GCO):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P8 (N97):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P9 (N93):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P10 (GCO):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P11 (N97):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P12 (N93):</label><input type="number" step="0.01" class="p-in"></div>
                <div class="campo"><label>P13 (GLP):</label><input type="number" step="0.01" class="p-in"></div>
            </div>
        </div>

        <button type="button" id="btn" class="btn" onclick="procesar()">GUARDAR PUNTO CERO</button>
    </form>
</div>

<script>
    const URL_APP = "https://script.google.com/macros/s/AKfycbxgDwm_R3oE9F9XTVcFl-vzAw5k4KHXg4s8CqS3MUgruoVMmOwVJ-YkcpQmvYIpKIjaKQ/exec";

    async function procesar() {
        const fecha = document.getElementById('fecha').value;
        const resp = document.getElementById('resp').value;
        if(!fecha || !resp) return alert("Complete Fecha y Responsable");

        // Captura los valores en el orden exacto de aparición en el HTML
        const tVals = Array.from(document.querySelectorAll('.t-in')).map(i => parseFloat(i.value) || 0);
        const pVals = Array.from(document.querySelectorAll('.p-in')).map(i => parseFloat(i.value) || 0);

        if(!confirm("¿Registrar estos valores como PUNTO CERO?")) return;

        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.innerText = "PROCESANDO...";

        const payload = {
            action: "guardarInicial",
            fecha: fecha,
            responsable: resp,
            tanques: tVals,
            picos: pVals
        };

        try {
            await fetch(URL_APP + "?action=guardarInicial", {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            });
            
            alert("¡ÉXITO! Los datos se han enviado.");
            document.getElementById('formInit').reset();
        } catch (e) {
            alert("Error: " + e.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "GUARDAR PUNTO CERO";
        }
    }
</script>
</body>
</html>

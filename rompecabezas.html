<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reto de Rompecabezas (60 Segundos)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Transición ultra fluida para el deslizamiento de las piezas */
        .puzzle-tile {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center font-sans antialiased p-4">

    <div class="glass max-w-md w-full rounded-3xl shadow-2xl p-6 md:p-8 text-slate-800 flex flex-col items-center border border-white/20">
        
        <!-- Cabecera -->
        <div class="text-center mb-4">
            <span class="inline-block p-3 bg-indigo-600 text-white rounded-2xl shadow-lg shadow-indigo-500/30 mb-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
            </span>
            <h1 class="text-2xl font-black tracking-tight text-slate-900">Reto de Rompecabezas</h1>
            <p class="text-sm text-slate-600 mt-1">Arma <code class="bg-slate-200 px-1.5 py-0.5 rounded text-indigo-700 font-mono text-xs"> la arañita</code> antes de que se acabe el tiempo.</p>
        </div>

        <!-- Panel de Tiempo y Estado -->
        <div class="flex items-center justify-between w-full mb-4 px-2">
            <div class="flex items-center gap-2 bg-slate-200/80 px-3 py-1.5 rounded-xl border border-slate-300">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Tiempo:</span>
                <span id="timer-display" class="font-mono font-bold text-lg text-indigo-700">60s</span>
            </div>
            <div id="status-badge" class="text-xs font-semibold px-3 py-1.5 rounded-xl bg-indigo-100 text-indigo-800 border border-indigo-200">
                Cargando...
            </div>
        </div>

        <!-- Contenedor del Tablero -->
        <div id="puzzle-board" class="relative w-72 h-72 md:w-80 md:h-80 bg-slate-300 rounded-2xl overflow-hidden shadow-inner border-4 border-slate-300 mb-6">
            <!-- Las piezas se inicializan aquí una sola vez -->
        </div>

        <!-- Controles (Oculto inicialmente, aparece al finalizar) -->
        <div id="controls-container" class="w-full hidden">
            <button onclick="startChallenge()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95 text-sm cursor-pointer">
                Jugar de Nuevo / Mezclar
            </button>
        </div>
        
        <p id="status-msg" class="text-xs text-slate-500 mt-4 font-medium text-center">Preparando imagen...</p>
    </div>

    <!-- Script principal -->
    <script>
        const GRID_SIZE = 3;
        let tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
        let imageSrc = 'imagen.jpg';
        let gameImage = new Image();
        let isPlaying = false;
        let timeLeft = 60;
        let timerInterval = null;
        let tileElements = []; // Almacena las referencias del DOM de las piezas

        window.addEventListener('DOMContentLoaded', () => {
            gameImage.onload = () => {
                initBoardDOM();
                startChallenge();
            };
            gameImage.onerror = () => {
                console.warn("No se pudo cargar imagen.jpg. Generando imagen de respaldo.");
                createFallbackImage();
                initBoardDOM();
                startChallenge();
            };
            gameImage.src = imageSrc;
        });

        function createFallbackImage() {
            const canvas = document.createElement('canvas');
            canvas.width = 600;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            
            const grad = ctx.createLinearGradient(0, 0, 600, 600);
            grad.addColorStop(0, '#4f46e5');
            grad.addColorStop(1, '#9333ea');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 600, 600);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('IMAGEN.JPG', 300, 280);
            
            ctx.font = '24px sans-serif';
            ctx.fillText('Rompecabezas 60s', 300, 340);

            imageSrc = canvas.toDataURL();
            gameImage.src = imageSrc;
        }

        // Crear los elementos del DOM una sola vez para asegurar que los clics nunca se pierdan
        function initBoardDOM() {
            const board = document.getElementById('puzzle-board');
            board.innerHTML = '';
            tileElements = [];

            for (let tileValue = 0; tileValue < GRID_SIZE * GRID_SIZE; tileValue++) {
                const tileDiv = document.createElement('div');
                tileDiv.className = 'puzzle-tile absolute bg-slate-300 overflow-hidden shadow-sm border border-slate-400/20';
                tileDiv.style.width = `${100 / GRID_SIZE}%`;
                tileDiv.style.height = `${100 / GRID_SIZE}%`;

                if (tileValue === GRID_SIZE * GRID_SIZE - 1) {
                    // Celda vacía (oculta)
                    tileDiv.style.display = 'none';
                } else {
                    const origRow = Math.floor(tileValue / GRID_SIZE);
                    const origCol = tileValue % GRID_SIZE;

                    tileDiv.style.backgroundImage = `url('${imageSrc}')`;
                    tileDiv.style.backgroundSize = `${GRID_SIZE * 100}% ${GRID_SIZE * 100}%`;
                    tileDiv.style.backgroundPosition = `${(origCol / (GRID_SIZE - 1)) * 100}% ${(origRow / (GRID_SIZE - 1)) * 100}%`;
                    tileDiv.classList.add('cursor-pointer', 'hover:brightness-105');

                    // Evento de clic vinculado permanentemente a esta pieza
                    tileDiv.addEventListener('click', () => {
                        if (!isPlaying) return;

                        const currentTileIndex = tiles.indexOf(tileValue);
                        const emptyIndex = tiles.indexOf(GRID_SIZE * GRID_SIZE - 1);
                        const validMoves = getValidMoves(emptyIndex);

                        if (validMoves.includes(currentTileIndex)) {
                            // Intercambiar en el array de estado
                            [tiles[emptyIndex], tiles[currentTileIndex]] = [tiles[currentTileIndex], tiles[emptyIndex]];
                            updateBoardPositions();

                            if (checkWinCondition()) {
                                triggerWin();
                            }
                        }
                    });
                }

                board.appendChild(tileDiv);
                tileElements[tileValue] = tileDiv;
            }
        }

        function startChallenge() {
            clearInterval(timerInterval);
            document.getElementById('controls-container').classList.add('hidden');

            // 1. Mostrar la imagen completa armada para memorizar (medio segundo)
            tiles = [0, 1, 2, 3, 4, 5, 6, 7, 8];
            isPlaying = false;
            updateBoardPositions(true); // true muestra la imagen unificada sin espacios
            
            document.getElementById('timer-display').textContent = "60s";
            const badge = document.getElementById('status-badge');
            badge.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-indigo-100 text-indigo-800 border border-indigo-200";
            badge.textContent = "¡Memoriza!";
            document.getElementById('status-msg').textContent = "Memoriza la imagen...";

            setTimeout(() => {
                shuffleWithAnimation();
            }, 500);
        }

        function shuffleWithAnimation() {
            let emptyIndex = GRID_SIZE * GRID_SIZE - 1;
            let steps = 0;
            const maxSteps = 24;

            const shuffleStep = () => {
                if (steps < maxSteps) {
                    const validMoves = getValidMoves(emptyIndex);
                    const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                    [tiles[emptyIndex], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIndex]];
                    emptyIndex = randomMove;
                    steps++;
                    updateBoardPositions(false);
                    setTimeout(shuffleStep, 55);
                } else {
                    if (checkWinCondition()) {
                        shuffleWithAnimation();
                        return;
                    }
                    isPlaying = true;
                    timeLeft = 60;
                    
                    document.getElementById('timer-display').textContent = `${timeLeft}s`;
                    const badge = document.getElementById('status-badge');
                    badge.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-amber-100 text-amber-800 border border-amber-200";
                    badge.textContent = "¡En curso!";
                    document.getElementById('status-msg').textContent = "Desliza las piezas adyacentes al espacio vacío.";

                    timerInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('timer-display').textContent = `${timeLeft}s`;

                        if (timeLeft <= 0) {
                            clearInterval(timerInterval);
                            timeOutFailure();
                        }
                    }, 1000);
                }
            };

            shuffleStep();
        }

        function getValidMoves(emptyIdx) {
            const row = Math.floor(emptyIdx / GRID_SIZE);
            const col = emptyIdx % GRID_SIZE;
            const moves = [];

            if (row > 0) moves.push(emptyIdx - GRID_SIZE);
            if (row < GRID_SIZE - 1) moves.push(emptyIdx + GRID_SIZE);
            if (col > 0) moves.push(emptyIdx - 1);
            if (col < GRID_SIZE - 1) moves.push(emptyIdx + 1);

            return moves;
        }

        // Actualiza la posición visual de cada pieza basándose en el arreglo 'tiles'
        function updateBoardPositions(forceComplete = false) {
            const won = checkWinCondition();

            tiles.forEach((tileValue, currentIndex) => {
                const tileDiv = tileElements[tileValue];
                if (!tileDiv) return;

                const currRow = Math.floor(currentIndex / GRID_SIZE);
                const currCol = currentIndex % GRID_SIZE;

                if ((won && !isPlaying) || forceComplete) {
                    // Mostrar como imagen completa sin espacios divisorios
                    tileDiv.style.display = 'block';
                    const origRow = Math.floor(tileValue / GRID_SIZE);
                    const origCol = tileValue % GRID_SIZE;
                    tileDiv.style.left = `${(origCol * 100) / GRID_SIZE}%`;
                    tileDiv.style.top = `${(origRow * 100) / GRID_SIZE}%`;
                } else {
                    // Estado normal de juego o mezcla
                    if (tileValue === GRID_SIZE * GRID_SIZE - 1) {
                        tileDiv.style.display = 'none'; // Ocultar celda vacía
                    } else {
                        tileDiv.style.display = 'block';
                        tileDiv.style.left = `${currCol * (100 / GRID_SIZE)}%`;
                        tileDiv.style.top = `${currRow * (100 / GRID_SIZE)}%`;
                    }
                }
            });
        }

        function checkWinCondition() {
            for (let i = 0; i < tiles.length; i++) {
                if (tiles[i] !== i) return false;
            }
            return true;
        }

        function triggerWin() {
            clearInterval(timerInterval);
            isPlaying = false;
            updateBoardPositions(false);

            document.getElementById('timer-display').textContent = "¡Completado!";
            const badge = document.getElementById('status-badge');
            badge.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-emerald-100 text-emerald-800 border border-emerald-200";
            badge.textContent = "¡Victoria!";
            document.getElementById('status-msg').textContent = "🎉 ¡Excelente! Has armado el rompecabezas a tiempo.";
            
            document.getElementById('controls-container').classList.remove('hidden');
        }

        function timeOutFailure() {
            isPlaying = false;
            shuffleWithAnimation();

            document.getElementById('timer-display').textContent = "0s (Agotado)";
            const badge = document.getElementById('status-badge');
            badge.className = "text-xs font-semibold px-3 py-1.5 rounded-xl bg-rose-100 text-rose-800 border border-rose-200";
            badge.textContent = "¡Tiempo fuera!";
            document.getElementById('status-msg').textContent = "❌ Se acabó el tiempo. ¡Las piezas se descompusieron!";
            
            document.getElementById('controls-container').classList.remove('hidden');
        }
    </script>
</body>
</html>
